#DB Properties
spring:
  jmx:
    enabled: false
  datasource:
    driver-class: org.h2.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    generate-dll: true
  mvc:
    log-request-details: false
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  #Keycloak/OAuth properties
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://test
          jwk-set-uri: http://test
#Logging properties
logging:
  file:
    name: /logs/app.log
  logback:
    rollingpolicy:
      max-history: 1
      max-file-size: 20MB
      clean-history-on-start: true
  pattern:
    file: '{"time_stamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%3p" ,"thread":"%t" ,"class":"%logger{36}","msg":"%replace(%msg){"[\n\r\"]",""}", "exception":"%replace(%rEx{10}){"[\n\r\"]",""}","http_event":%X{httpEvent:-""},"message_event":%X{messageEvent:-""}}%nopex%n'
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] [%t] [%logger{36}] [%replace(%msg){'[\n\r\"]',''} %X{httpEvent} %X{messageEvent}] %replace(%rEx{10}){'[\n\r\"]',''}%nopex%n"
  level:
    ca:
      bc:
        gov:
          educ:
            api:
              coreg: INFO
    org:
      springframework:
        web: INFO
        security: INFO
        boot:
          autoconfigure:
            logging: INFO
    com:
      zaxxer:
        hikari: ERROR

#Local properties
server:
  undertow:
    threads:
      worker: 128
      io: 16
  #port: 8096
  max-http-request-header-size: 20000

#API Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /index.html
    operationsSorter: alpha

#Nats
nats:
  url: localhost
  maxReconnect: 60

#Scheduler
scheduler:
  read-coreg-events:
    rate: 600000
    lockAtLeastFor: PT1M
    lockAtMostFor: PT5M
    threshold: 100
  publish-coreg-events:
    rate: 180000
    lockAtLeastFor: PT1M
    lockAtMostFor: PT5M
    threshold: 100
