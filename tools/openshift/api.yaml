---
apiVersion: template.openshift.io/v1
kind: Template
labels:
    template: "${REPO_NAME}-template"
metadata:
    name: "${REPO_NAME}-${BRANCH}-dc"
objects:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app: "${APP_NAME}"
    name: "${APP_NAME}"
  spec:
    replicas: ${{MIN_REPLICAS}}
    selector:
      matchLabels:
        app: "${APP_NAME}"
    strategy:
      rollingUpdate:
        maxUnavailable: 25%
        maxSurge: 25%
    template:
      metadata:
        annotations:
          openshift.io/generated-by: coregapi
          prometheus.io/path: /actuator/prometheus
          prometheus.io/port: '8080'
          prometheus.io/scrape: 'true'
        labels:
          app: "${APP_NAME}"
      spec:
        containers:
        - image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/${REPO_NAME}-${BRANCH}:${TAG}
          imagePullPolicy: Always
          volumeMounts:
          - name: log-storage
            mountPath: /logs
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          name: "${APP_NAME}"
          ports:
          - containerPort: ${{CONTAINER_PORT}}
            protocol: TCP
          envFrom:
          - configMapRef:
              name: "${APP_NAME}-config-map"
          - secretRef:
              name: "${APP_NAME}-db-secret"
          resources:
            requests:
              cpu: "${MIN_CPU}"
              memory: "${MIN_MEM}"
            limits:
              cpu: "${MAX_CPU}"
              memory: "${MAX_MEM}"
        volumes:
        - name: log-storage
          emptyDir: {}
    test: false
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      app: "${APP_NAME}"
    name: "${APP_NAME}"
  spec:
    ports:
    - name: ${CONTAINER_PORT}-tcp
      port: ${{CONTAINER_PORT}}
      protocol: TCP
    selector:
      app: "${APP_NAME}"
- apiVersion: autoscaling/v2
  kind: HorizontalPodAutoscaler
  metadata:
    name: "${APP_NAME}-cpu-autoscaler"
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: "${APP_NAME}"
      subresource: scale
    minReplicas: ${{MIN_REPLICAS}}
    maxReplicas: ${{MAX_REPLICAS}}
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 200
parameters:
- name: REPO_NAME
  description: Application repository name
  required: true
- name: BRANCH
  description: Job identifier (i.e. 'backend' OR 'frontend')
  required: true
- name: NAMESPACE
  description: Target namespace reference (i.e. 'k8vopl-dev')
  required: true
- name: APP_NAME
  description: Application name
  required: true
- name: CONTAINER_PORT
  description: The port on which the application will be accessible
  value: "8080"
  required: false
- name: TAG
  description: The identifying tag for this specific deployment
  required: true
- name: MIN_REPLICAS
  description: The minimum amount of replicas
  required: true
- name: MAX_REPLICAS
  description: The maximum amount of replicas
  required: true
- name: MIN_CPU
  description: The minimum amount of cpu
  required: true
- name: MAX_CPU
  description: The maximum amount of cpu
  required: true
- name: MIN_MEM
  description: The minimum amount of memory
  required: true
- name: MAX_MEM
  description: The maximum amount of memory
  required: true
